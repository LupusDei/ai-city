name: CI

on:
  push:
    # All real work happens on agent/* branches (see agent/raynor,
    # agent/stetmann, ...); a gate that only triggers on main never runs
    # until merge, which is how CI went red on every push without anyone
    # noticing (aic-j18 / aic-hfp). `agent/**` covers any nesting depth,
    # not just the single-level names in use today.
    branches: [main, 'agent/**']
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci


      # Single definition of the gate: typecheck -> lint -> build ->
      # test:coverage. This MUST stay `npm run verify`, not four hand-listed
      # steps. The previous version of this workflow re-listed the steps,
      # omitted typecheck entirely, and ran the suite twice (`npm test` then
      # `npm run test:coverage`, the second of which is the only one that
      # enforces the Constitution §1 coverage thresholds) — exactly the kind
      # of drift a single shared command prevents (aic-hfp). Matrix/caching
      # above are the only parts that legitimately can't live in package.json;
      # the gate itself is one command so it cannot drift from what
      # developers run locally.
      - name: Verify (typecheck, lint, build, test with coverage)
        run: npm run verify

  # ---------------------------------------------------------------------------
  # Acceptance suite — tests/acceptance/playable-start.spec.ts driving a real browser
  # against a real dev server. This is the definition of done for spec 005.
  #
  # WHY A SEPARATE JOB. It answers a different question from `build-and-test`
  # ("can a person start this game and take a turn" vs "is the code correct"), it
  # needs a browser download the unit job does not, and it must be able to fail
  # without taking the unit gate down with it.
  #
  # continue-on-error WAS set here while the suite had no app to run against — it was
  # written first and failed for the right reason, and without the flag every unrelated PR
  # would have gone red for the duration of Epic 3.
  #
  # REMOVED on 2026-07-30, the commit after the suite first went 16/16 (aic-57z). It was a
  # scaffold, not a policy about acceptance tests, and leaving it would have turned the
  # project's ONLY end-to-end gate into decoration — precisely the failure aic-j18 was
  # filed for, where constitution s3 mandated a lint gate that had never once run.
  #
  # This job is now BLOCKING. A failing acceptance test means a person can no longer start
  # the game and take a turn, and that should stop a merge.
  # ---------------------------------------------------------------------------
  acceptance:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Only chromium: the acceptance criteria are about game flow, not browser
      # compatibility, and three engines would triple the download for no signal.
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Acceptance tests
        run: npm run test:acceptance

      - name: Upload acceptance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

